# Regime classification thresholds — v1 rules-based
# Populated in Phase 2 (regime module). Thresholds are explicit and tunable.

# Signals used:
#   - T10Y2Y            yield curve slope (FRED, daily)
#   - NFCI              Chicago Fed financial conditions, primary stress signal (FRED, weekly)
#                       STLFSI4 (St. Louis Fed) is ingested as a robustness check only
#   - SPY realized vol  60d annualized, computed from prices in Phase 2
#   - UNRATE trend      unemployment rate (FRED, monthly)
# VIXCLS and BAMLH0A0HYM2 are NOT used (copyrighted; see docs/decisions/0002).
#
# Look-ahead: use only values published by each date.
#   - NFCI / STLFSI4 are dated on the week's Friday and released the following Wednesday/Thursday.
#   - UNRATE / CPIAUCSL / FEDFUNDS are dated on the 1st of the month and released the next month.
#   - FRED stores the latest vintage only, so revisions are a residual look-ahead (methodology.md).

# regimes:
#   expansion:
#     ...
#   slowdown:
#     ...
#   stress:
#     ...
