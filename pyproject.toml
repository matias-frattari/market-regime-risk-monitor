[project]
name = "mrm"
version = "0.1.0"
description = "Market Regime & Portfolio Risk Monitor"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.0", "hatchling>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
