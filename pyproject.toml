[project]
name = "mrm"
version = "0.1.0"
description = "Market Regime & Portfolio Risk Monitor"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "hmmlearn>=0.3.3",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "threadpoolctl>=3.8.0",
]

[project.scripts]
mrm = "mrm.cli:main"

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.0", "hatchling>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# hmmlearn 0.3.3 sets ndarray.shape in its utils (deprecated in NumPy 2.5); not our code.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:hmmlearn",
]
